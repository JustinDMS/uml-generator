<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pseudocode to UML</title>
  <meta name="description" content="Convert pseudocode into UML activity diagrams, entirely in the browser." />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    // Apply a saved theme before first paint so there's no flash of the wrong one.
    try {
      const theme = localStorage.getItem('p2u.theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <label class="field">
      <span class="visually-hidden">Load example</span>
      <select id="examples">
        <option value="">Load example…</option>
      </select>
    </label>
    <div class="toolbar">
      <span class="version" id="version"></span>
      <button type="button" id="export-svg">SVG</button>
      <button type="button" id="export-png">PNG</button>
      <button type="button" id="theme-toggle" class="icon-button" aria-label="Switch to dark mode" title="Switch to dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg>
      </button>
    </div>
  </header>

  <main class="workspace">
    <section class="pane editor-pane" id="editor-pane" aria-label="Pseudocode editor">
      <div class="pane-head">
        <span>Pseudocode</span>
        <button type="button" class="link" id="syntax-toggle" aria-expanded="false" aria-controls="syntax">Syntax help</button>
      </div>
      <div class="syntax" id="syntax" hidden>
        <table>
          <tr><td><code>START</code> / <code>END</code></td><td>start / end node (<code>END x</code> ends with x)</td></tr>
          <tr><td><code>IF</code> / <code>ELIF</code> / <code>ELSE</code></td><td>decision</td></tr>
          <tr><td><code>WHILE</code></td><td>loop</td></tr>
          <tr><td><code>FOR …</code></td><td>loop over …</td></tr>
          <tr><td><code>DO</code> … <code>WHILE</code></td><td>loop, test last</td></tr>
          <tr><td><code>DEF</code> / <code>DEF f()</code></td><td>frame / callable frame: <code>f()</code> calls it</td></tr>
        </table>
        <p>Indent to nest · <code>//</code> comment</p>
      </div>
      <div class="editor">
        <pre class="gutter" id="gutter" aria-hidden="true"></pre>
        <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off"
          aria-label="Pseudocode source"></textarea>
      </div>
      <div class="problems" id="problems" aria-live="polite"></div>
    </section>

    <div class="divider" id="divider" role="separator" aria-orientation="vertical" aria-controls="editor-pane"
      aria-label="Resize editor (double-click to reset)" tabindex="0"></div>

    <section class="pane diagram-pane" aria-label="Activity diagram">
      <div class="viewport" id="viewport" tabindex="0" aria-label="Diagram. Drag to pan, scroll to zoom.">
        <div class="stage" id="stage"></div>
      </div>
      <div class="zoom" role="group" aria-label="Zoom">
        <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
        <button type="button" id="zoom-reset" class="zoom-level" aria-label="Reset zoom to 100%">100%</button>
        <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
        <button type="button" id="zoom-fit">Fit</button>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script src="js/version.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/render.js"></script>
  <script src="js/export.js"></script>
  <script src="js/examples.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
